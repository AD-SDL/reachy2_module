[project]
name = "reachy2_module"
version = "1.0.0"
description = "Reachy2 robot module for AD-SDL automation with LeRobot integration"
authors = [
    {name = "Doga Ozgulbas", email="dozgulbas@anl.gov"},
]
dependencies = [
   
    "madsci-node-module~=0.8.0",
    "madsci-client~=0.8.0",
    "madsci-common~=0.8.0",
    "lerobot[reachy2, dataset] @ git+https://github.com/AD-SDL/lerobot.git@main"
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
homepage = "https://github.com/AD-SDL/reachy2_module"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.12.0",
    "pre-commit>=4.3.0",
]

[build-system]
requires = ["setuptools>=71.0.0", "wheel"]
build-backend = "setuptools.build_meta"